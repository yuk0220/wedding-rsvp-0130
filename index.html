<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Wedding Invitation">
    <meta property="og:description" content="Our Special Day">
    <meta property="og:image" content="">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-text fade-in">
                <h1 class="couple-names">신랑 & 신부</h1>
                <p class="wedding-date">2026.05.13</p>
                <p class="hero-message">함께하는 기쁨</p>
            </div>
        </div>
        <div class="scroll-indicator">
            <div class="scroll-dot"></div>
        </div>
    </section>

    <!-- Opening Message -->
    <section class="opening-message">
        <div class="message-content scroll-reveal">
            <p class="message-text">
                사랑하는 가족과 친구분들께
            </p>
            <p class="message-subtext">
                저희의 특별한 날을 함께해 주시기를 바랍니다.
            </p>
        </div>
    </section>

    <!-- Couple Introduction -->
    <section class="couple-intro">
        <div class="couple-grid">
            <div class="couple-card fade-up">
                <div class="couple-image groom"></div>
                <h3>신랑</h3>
                <p class="couple-name">이름</p>
                <p class="couple-description">가족 정보</p>
            </div>
            <div class="couple-card fade-up" style="animation-delay: 0.2s;">
                <div class="couple-image bride"></div>
                <h3>신부</h3>
                <p class="couple-name">이름</p>
                <p class="couple-description">가족 정보</p>
            </div>
        </div>
    </section>

    <!-- Wedding Information -->
    <section class="wedding-info">
        <h2>예식 정보</h2>
        <div class="info-grid">
            <div class="info-card scroll-reveal">
                <p class="info-label">날짜</p>
                <p class="info-value">2026년 5월 13일</p>
            </div>
            <div class="info-card scroll-reveal">
                <p class="info-label">시간</p>
                <p class="info-value">오후 3시</p>
            </div>
            <div class="info-card scroll-reveal">
                <p class="info-label">장소</p>
                <p class="info-value">예식홀 이름</p>
            </div>
            <div class="info-card scroll-reveal">
                <p class="info-label">연락처</p>
                <p class="info-value">010-XXXX-XXXX</p>
            </div>
        </div>
    </section>

    <!-- Gallery -->
    <section class="gallery">
        <h2>갤러리</h2>
        <div class="gallery-grid">
            <div class="gallery-item scroll-reveal">
                <div class="gallery-placeholder"></div>
            </div>
            <div class="gallery-item scroll-reveal">
                <div class="gallery-placeholder"></div>
            </div>
            <div class="gallery-item scroll-reveal">
                <div class="gallery-placeholder"></div>
            </div>
            <div class="gallery-item scroll-reveal">
                <div class="gallery-placeholder"></div>
            </div>
        </div>
    </section>

    <!-- Location -->
    <section class="location">
        <h2>찾아오시는 길</h2>
        <div class="map-placeholder"></div>
        <div class="location-info">
            <p class="address">서울시 강남구 테헤란로</p>
            <div class="button-group">
                <button class="btn btn-primary">카카오맵</button>
                <button class="btn btn-secondary">네이버지도</button>
                <button class="btn btn-tertiary">주소 복사</button>
            </div>
        </div>
    </section>

    <!-- RSVP -->
    <section class="rsvp">
        <h2>참석 의사</h2>
        <form class="rsvp-form">
            <div class="form-group">
                <label>성함</label>
                <input type="text" name="name" placeholder="이름을 입력해주세요" required>
            </div>
            <div class="form-group">
                <label>참석 여부</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="yes"> 참석
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="no"> 불참
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label>동행 인원</label>
                <select name="guests" required>
                    <option value="">선택해주세요</option>
                    <option value="1">1명</option>
                    <option value="2">2명</option>
                    <option value="3">3명</option>
                    <option value="4">4명</option>
                    <option value="5">5명 이상</option>
                </select>
            </div>
            <button type="submit" class="btn btn-submit">전송하기</button>
        </form>
    </section>

    <!-- Ending Message -->
    <section class="ending">
        <div class="ending-content">
            <p class="ending-message">감사합니다</p>
            <p class="ending-subtext">특별한 날에 함께해주셔서 감사드립니다</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
